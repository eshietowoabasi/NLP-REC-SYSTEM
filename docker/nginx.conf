# Serves the built Vue app and proxies the API (spec §3, §18).
# In production, terminate HTTPS here: add a `listen 443 ssl` server block with the
# institution's certificate and redirect port 80 to it.
server {
    listen 80;
    server_tokens off;
    client_max_body_size 26m;  # 25 MB document limit + form overhead (spec §7.2)

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/sessions/12, /admin/users …) fall back to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
