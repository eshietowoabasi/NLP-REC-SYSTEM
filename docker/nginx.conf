# Development reverse proxy. In production, terminate HTTPS here (spec §18)
# by adding a `listen 443 ssl` server block with the institution's certificate.
server {
    listen 80;
    client_max_body_size 26m;  # 25 MB document limit + form overhead (spec §7.2)

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The Vue.js frontend will be served from here once it is added (Sprint 5).
    location / {
        default_type text/plain;
        return 200 "NLP-RS API is running. Frontend not yet deployed.\n";
    }
}
