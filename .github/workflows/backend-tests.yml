name: Backend tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nlprs
          POSTGRES_PASSWORD: nlprs
          POSTGRES_DB: nlprs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nlprs" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://nlprs:nlprs@localhost:5432/nlprs_test
      EMBEDDING_BACKEND: hashing
      DATABASE_URL: postgresql+psycopg2://nlprs:nlprs@localhost:5432/nlprs_test
      FLASK_APP: wsgi.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip setuptools
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Migrations apply and match the models
        run: |
          flask db upgrade
          flask db check
          flask db downgrade base
      - name: Dependency vulnerability audit
        run: |
          pip install pip-audit
          # Audit the installed environment (CPU torch); -r would resolve CUDA torch wheels.
          pip-audit --progress-spinner off
      - name: Unit tests (PostgreSQL)
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=85
