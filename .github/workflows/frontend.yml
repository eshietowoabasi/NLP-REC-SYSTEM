name: Frontend

on:
  push:
  pull_request:

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

  e2e:
    # Full workflow in Chromium against Flask + Celery + PostgreSQL + Redis.
    runs-on: ubuntu-latest
    needs: unit-and-build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nlprs
          POSTGRES_PASSWORD: nlprs
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nlprs" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      APP_CONFIG: development
      SECRET_KEY: ci-e2e-secret
      DATABASE_URL: postgresql+psycopg2://nlprs:nlprs@localhost:5432/nlprs_e2e
      ADMIN_DB_URL: postgresql://nlprs:nlprs@localhost:5432/postgres
      E2E_DB_NAME: nlprs_e2e
      REDIS_URL: redis://localhost:6379/0
      EMBEDDING_BACKEND: hashing
      FLASK_APP: wsgi.py
      UPLOAD_FOLDER: /tmp/nlprs/uploads
      REPORT_FOLDER: /tmp/nlprs/reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend (CPU-only torch)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip setuptools
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Prepare database and users
        run: frontend/tests/e2e/reset-db.sh
      - name: Start API, worker and frontend
        run: |
          cd backend
          nohup celery -A celery_worker.celery worker --loglevel=info --concurrency=1 > /tmp/worker.log 2>&1 &
          nohup gunicorn -b 127.0.0.1:5000 --workers 2 wsgi:app > /tmp/api.log 2>&1 &
          cd ../frontend
          nohup npx vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/api/health && break; sleep 2; done
      - name: Playwright
        working-directory: frontend
        run: npx playwright test
      - name: Logs on failure
        if: failure()
        run: tail -n 100 /tmp/api.log /tmp/worker.log /tmp/preview.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results
