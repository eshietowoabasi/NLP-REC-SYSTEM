[project]
name = "nlp-rs-backend"
version = "0.1.0"
description = "NLP-Driven Curriculum Recommendation System - Flask API and NLP pipeline"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # umap-learn's optional ParametricUMAP needs TensorFlow, which this project does not use.
    "ignore:Tensorflow not installed:ImportWarning",
]
markers = [
    "real_models: uses the real SBERT model (downloaded on first use) instead of the test fake",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
