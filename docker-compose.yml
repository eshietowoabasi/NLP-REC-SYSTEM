# Full development stack. Usage: cp .env.example .env && docker compose up --build
# Open http://localhost:${HTTP_PORT:-8080}. Source folders are bind-mounted for hot reload.
#
# Postgres and Redis are defined in docker-compose.services.yml, which can also be run on its
# own (lightweight mode, see docs/SETUP.md).
name: nlprs

include:
  - docker-compose.services.yml

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  SECRET_KEY: ${SECRET_KEY}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  STORAGE_DIR: /data/storage
  ADMIN_USERNAME: ${ADMIN_USERNAME:-}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-}

services:
  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    # Apply pending migrations, then start the auto-reloading dev server.
    command: sh -c "flask --app wsgi db upgrade && flask --app wsgi run --debug --host 0.0.0.0 --port 5000"
    environment: *backend-env
    volumes:
      - ./backend:/app
      - storage-data:/data/storage
      - models-data:/data/models
    ports:
      - "${BACKEND_HOST_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    command: python -m app.worker
    # Jobs run in the worker process (models stay loaded); restart it if it ever stops.
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - ./backend:/app
      - storage-data:/data/storage
      - models-data:/data/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    # node_modules lives in a volume that survives rebuilds, so reinstall whenever
    # package-lock.json has changed since the last install, then start Vite.
    command: >
      sh -c "sha1sum -c node_modules/.lock-hash >/dev/null 2>&1 ||
             (npm install --no-audit --no-fund && sha1sum package-lock.json > node_modules/.lock-hash);
             exec npm run dev"
    environment:
      VITE_API_PROXY_TARGET: http://backend:5000
      VITE_HMR_CLIENT_PORT: ${HTTP_PORT:-8080}
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      # Keep the container's Linux node_modules separate from the host's.
      - /app/node_modules

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - backend
      - frontend

volumes:
  storage-data:
  models-data:
