# Full development stack. Usage: cp .env.example .env && docker compose up --build
# Open http://localhost:${HTTP_PORT:-8080}. Source folders are bind-mounted for hot reload.
#
# Postgres and Redis are defined in docker-compose.services.yml, which can also be run on its
# own (lightweight mode, see docs/SETUP.md).
name: nlprs

include:
  - docker-compose.services.yml

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  SECRET_KEY: ${SECRET_KEY}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  STORAGE_DIR: /data/storage

services:
  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    command: flask --app wsgi run --debug --host 0.0.0.0 --port 5000
    environment: *backend-env
    volumes:
      - ./backend:/app
      - storage-data:/data/storage
    ports:
      - "${BACKEND_HOST_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    command: python -m app.worker
    environment: *backend-env
    volumes:
      - ./backend:/app
      - storage-data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_PROXY_TARGET: http://backend:5000
      VITE_HMR_CLIENT_PORT: ${HTTP_PORT:-8080}
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      # Keep the container's Linux node_modules separate from the host's.
      - /app/node_modules

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - backend
      - frontend

volumes:
  storage-data:
