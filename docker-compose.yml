services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nlprs}
      POSTGRES_USER: ${POSTGRES_USER:-nlprs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nlprs}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nlprs} -d ${POSTGRES_DB:-nlprs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment: &backend-env
      APP_CONFIG: ${APP_CONFIG:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-key}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-nlprs}:${POSTGRES_PASSWORD:-nlprs}@postgres:5432/${POSTGRES_DB:-nlprs}
      REDIS_URL: redis://redis:6379/0
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-sbert}
    volumes:
      - uploads:/data/raw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Runs the NLP pipeline (spec §15). Scale with `docker compose up --scale worker=2`.
  worker:
    build: ./backend
    command: ["celery", "-A", "celery_worker.celery", "worker", "--loglevel=info", "--concurrency=1"]
    environment: *backend-env
    volumes:
      - uploads:/data/raw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads:
