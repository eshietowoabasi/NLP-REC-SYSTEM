# Development reverse proxy: one origin for the browser.
#   /api/*  -> Flask backend
#   /*      -> Vite dev server (including the hot-reload websocket)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Resolve container names through Docker's DNS on every request (cached 10 s), so a
    # recreated backend/frontend container with a new IP is picked up without restarting
    # Nginx. Using variables in proxy_pass is what makes Nginx re-resolve.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:5000;
    set $frontend_upstream http://frontend:5173;

    # Flask enforces the real limits (25 MB per file); this only caps the request size.
    client_max_body_size 100m;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
