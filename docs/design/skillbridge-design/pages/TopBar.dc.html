<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<header style="width: 1184px; height: 72px; box-sizing: border-box; padding: 0 40px; background: #FFFFFF; border-bottom: 1px solid #EADFD3; display: flex; align-items: center; justify-content: space-between; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #231A14;">
  <div style="display: flex; flex-direction: column; gap: 2px;">
    <span style="font-size: 12px; color: #6F625A;">{{crumb}}</span>
    <span style="font-size: 17px; font-weight: 800; letter-spacing: -0.01em;">{{title}}</span>
  </div>
  <div style="display: flex; align-items: center; gap: 14px;">
    <button type="button" aria-label="Notifications" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #EADFD3; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A3F37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
    </button>
    <button type="button" style="display: flex; align-items: center; gap: 10px; border: 0; background: transparent; font: inherit; cursor: pointer; padding: 4px 6px; border-radius: 12px;">
      <span style="width: 40px; height: 40px; border-radius: 50%; background: #F2B84B; color: #4A2C00; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800;">{{initials}}</span>
      <span style="display: flex; flex-direction: column; align-items: flex-start;"><span style="font-size: 14px; font-weight: 700; color: #231A14;">{{person}}</span><span style="font-size: 12px; color: #6F625A;">{{role}}</span></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6F625A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Dashboard"},"crumb":{"editor":"text","default":"Workspace"},"person":{"editor":"text","default":"Mr John Okon"},"role":{"editor":"text","default":"Curriculum Planner"},"initials":{"editor":"text","default":"JO"},"$preview":{"width":1184,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      title: this.props.title ?? 'Dashboard',
      crumb: this.props.crumb ?? 'Workspace',
      person: this.props.person ?? 'Mr John Okon',
      role: this.props.role ?? 'Curriculum Planner',
      initials: this.props.initials ?? 'JO'
    };
  }
}
</script>
</body>
</html>
