</helmet>
<nav aria-label="Main" style="width: 256px; height: 900px; box-sizing: border-box; padding: 22px 16px; background: #FFFFFF; display: flex; flex-direction: column; gap: 22px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #231A14;">

  <div style="display: flex; flex-direction: column; gap: 4px;">
    <span style="padding: 0 12px 6px 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #8A7C72;">WORKSPACE</span>
    <sc-for list="{{main}}" as="item" hint-placeholder-count="4">
      <a href="{{item.href}}" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; font-size: 14px; text-decoration: none; {{item.style}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{item.d}}"></path></svg>{{item.label}}</a>
    </sc-for>
  </div>
  <sc-if value="{{showAdmin}}" hint-placeholder-val="{{true}}">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <span style="padding: 0 12px 6px 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #8A7C72;">ADMINISTRATION</span>
      <sc-for list="{{admin}}" as="item" hint-placeholder-count="4">
        <a href="{{item.href}}" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; font-size: 14px; text-decoration: none; {{item.style}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{item.d}}"></path></svg>{{item.label}}</a>
      </sc-for>
    </div>
  </sc-if>
  <div style="margin-top: auto; padding: 16px; border-radius: 16px; background: #FDF1D8; display: flex; flex-direction: column; gap: 6px;">
    <span style="font-size: 13px; font-weight: 800; color: #6B4A00;">New here?</span>
    <span style="font-size: 12px; line-height: 1.5; color: #6B4A00;">Review topics, design courses, then download your report.</span>
    <a href="Dashboard.dc.html" style="font-size: 12px; font-weight: 700; color: #7E2F12; text-decoration: none;">See how it works →</a>
  </div>
</nav>
</x-dc>
