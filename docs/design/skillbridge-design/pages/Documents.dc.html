<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Documents</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#FBF6EF;color:#231A14}
a{color:#A8431E}a:hover{color:#7E2F12}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #FBF6EF;">
  <div style="width: 256px; flex-shrink: 0; background: #FFFFFF; border-right: 1px solid #EADFD3;"><dc-import name="Sidebar" active="documents" admin="{{no}}" hint-size="256px,900px"></dc-import></div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0;">
    <dc-import name="TopBar" title="Documents" crumb="Workspace" person="Mr John Okon" role="Curriculum Planner" initials="JO" hint-size="1184px,72px"></dc-import>
    <main style="padding: 28px 40px; display: flex; flex-direction: column; gap: 18px;">
      <div style="display: flex; justify-content: space-between; align-items: flex-end;">
        <div style="display: flex; flex-direction: column; gap: 4px;"><h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.03em;">Documents</h1><p style="margin: 0; font-size: 14px; color: #5E5249;">Everything the system learns from: job adverts, policy papers and the NUC core curriculum.</p></div>
        <div style="display: flex; gap: 10px;">
          <button type="button" style="height: 46px; padding: 0 18px; border-radius: 12px; border: 1px solid #E3D6C8; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; color: #231A14; cursor: pointer; display: flex; align-items: center; gap: 8px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#231A14" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path></svg>Upload files</button>
          <a href="AddDocuments.dc.html" style="height: 46px; padding: 0 18px; border-radius: 12px; background: #A8431E; color: #FFFFFF; font-size: 14px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 8px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>Collect job adverts</a>
        </div>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px;">
        <div style="display: flex; gap: 8px;">
          <button type="button" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 0; background: #231A14; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700;">All · 56</button>
          <button type="button" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid #E3D6C8; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; color: #231A14;">Job adverts · 54</button>
          <button type="button" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid #E3D6C8; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; color: #231A14;">Policy papers · 1</button>
          <button type="button" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid #E3D6C8; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; color: #231A14;">NUC core · 1</button>
        </div>
        <div style="position: relative; width: 320px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A7C72" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 14px; top: 13px;"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14zM21 21l-4.3-4.3"></path></svg>
          <label for="doc-search" style="position: absolute; left: -9999px;">Search documents</label>
          <input id="doc-search" type="search" placeholder="Search by title or company" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 14px 0 42px; font: inherit; font-size: 14px; border: 1px solid #E3D6C8; border-radius: 12px; background: #FFFFFF;">
        </div>
      </div>
      <section style="background: #FFFFFF; border: 1px solid #EADFD3; border-radius: 20px; overflow: hidden;">
        <div style="display: grid; grid-template-columns: minmax(0, 3.2fr) minmax(0, 1.2fr) minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 0.8fr); gap: 16px; padding: 14px 24px; background: #FBF6EF; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: #6F625A;"><span>DOCUMENT</span><span>TYPE</span><span>SOURCE</span><span>ADDED</span><span>STATUS</span></div>
        <sc-for list="{{docs}}" as="d" hint-placeholder-count="7">
          <a href="DocumentDetail.dc.html" style="display: grid; grid-template-columns: minmax(0, 3.2fr) minmax(0, 1.2fr) minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 0.8fr); gap: 16px; align-items: center; padding: 14px 24px; border-top: 1px solid #F1E8DE; text-decoration: none; color: #231A14;">
            <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0;"><span style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{d.title}}</span><span style="font-size: 12px; color: #6F625A;">{{d.sub}}</span></span>
            <span><span style="padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; {{d.chip}}">{{d.type}}</span></span>
            <span style="font-size: 13px; color: #4A3F37;">{{d.source}}</span>
            <span style="font-size: 13px; color: #4A3F37;">{{d.date}}</span>
            <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #2F6B3A;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #2F6B3A;"></span>Ready</span>
          </a>
        </sc-for>
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; border-top: 1px solid #F1E8DE; font-size: 13px; color: #6F625A;"><span>Showing 7 of 56</span><div style="display: flex; gap: 8px;"><button type="button" style="height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid #E3D6C8; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; color: #231A14;">Previous</button><button type="button" style="height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid #E3D6C8; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; color: #231A14;">Next</button></div></div>
      </section>
    </main>
  </div>
</div>
</x-dc>

    const job = 'background: #F8E6DC; color: #7E2F12;';

    return {

        { title: 'Application Security Analyst', sub: 'Hydrogen Payment Services · Lagos', type: 'Job advert', chip: job, source: 'MyJobMag', date: '25 Sept 2026' },
        { title: 'Senior Full-Stack Developer (C#/.NET and React)', sub: 'Zealight Innovation Labs', type: 'Job advert', chip: job, source: 'MyJobMag', date: '25 Sept 2026' },
        { title: 'Senior Data Engineer', sub: 'Bluechip Technologies', type: 'Job advert', chip: job, source: 'MyJobMag', date: '25 Sept 2026' },
        { title: 'Senior Site Reliability Engineer', sub: 'Moniepoint', type: 'Job advert', chip: job, source: 'MyJobMag', date: '25 Sept 2026' },
        { title: 'QA Analyst', sub: 'Moniepoint', type: 'Job advert', chip: job, source: 'MyJobMag', date: '25 Sept 2026' },
        { title: 'National Digital Economy Policy and Strategy 2020–2030', sub: 'Federal Ministry of Communications and Digital Economy', type: 'Policy paper', chip: pol, source: 'NITDA', date: '25 Sept 2026' },
        { title: 'NUC CCMAS Computing 2023', sub: '118 courses · active reference', type: 'NUC core', chip: nuc, source: 'NUC', date: '24 Sept 2026' }

  }
}
</script>
</body>
</html>
