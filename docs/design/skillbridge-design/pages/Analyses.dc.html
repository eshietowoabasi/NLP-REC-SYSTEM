<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Analyses</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#FBF6EF;color:#231A14}
a{color:#A8431E}a:hover{color:#7E2F12}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #FBF6EF;">
  <div style="width: 256px; flex-shrink: 0; background: #FFFFFF; border-right: 1px solid #EADFD3;"><dc-import name="Sidebar" active="analyses" admin="{{no}}" hint-size="256px,900px"></dc-import></div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0;">
    <dc-import name="TopBar" title="Analyses" crumb="Workspace" person="Mr John Okon" role="Curriculum Planner" initials="JO" hint-size="1184px,72px"></dc-import>
    <main style="padding: 28px 40px; display: flex; flex-direction: column; gap: 18px;">
      <div style="display: flex; justify-content: space-between; align-items: flex-end;">
        <div style="display: flex; flex-direction: column; gap: 4px;"><h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.03em;">Analyses</h1><p style="margin: 0; font-size: 14px; color: #5E5249;">Each analysis reads a set of documents and suggests course topics for you to review.</p></div>
        <a href="NewAnalysis.dc.html" style="height: 46px; padding: 0 18px; border-radius: 12px; background: #A8431E; color: #FFFFFF; font-size: 14px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 8px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>New analysis</a>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
          <a href="Recommendations.dc.html" style="background: #FFFFFF; border: 1px solid #EADFD3; border-radius: 20px; padding: 22px 24px; display: flex; flex-direction: column; gap: 16px; text-decoration: none; color: #231A14;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;">
              <div style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 17px; font-weight: 800; letter-spacing: -0.01em;">{{r.name}}</span><span style="font-size: 13px; color: #6F625A;">{{r.meta}}</span></div>
              <span style="padding: 5px 10px; border-radius: 999px; background: #E3F1E4; color: #1F4D28; font-size: 12px; font-weight: 700; white-space: nowrap;">Completed</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              <div style="display: flex; justify-content: space-between; font-size: 13px;"><span style="color: #5E5249;">Review progress</span><strong>{{r.progress}}</strong></div>
              <div style="height: 8px; border-radius: 4px; background: #F1E8DE;"><div style="height: 8px; border-radius: 4px; background: #A8431E; width: {{r.pct}};"></div></div>
            </div>
            <div style="display: flex; gap: 20px; font-size: 13px; color: #4A3F37;"><span><strong style="color: #231A14;">{{r.accepted}}</strong> accepted</span><span><strong style="color: #231A14;">{{r.courses}}</strong> courses designed</span><span style="margin-left: auto; font-weight: 700; color: #A8431E;">Open →</span></div>
          </a>
        </sc-for>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      no: false,
      rows: [
        { name: 'Real corpus (final)', meta: '27 Sept 2026 · 56 documents · 20 topics', progress: '2 of 20 reviewed', pct: '10%', accepted: '2', courses: '1' },
        { name: 'Course for 100L Computer Science', meta: '27 Sept 2026 · 56 documents · 20 topics', progress: 'Not started', pct: '0%', accepted: '0', courses: '0' },
        { name: 'Real corpus: document-weighted strength', meta: '27 Sept 2026 · 56 documents · 20 topics', progress: '2 of 20 reviewed', pct: '10%', accepted: '1', courses: '0' },
        { name: 'Real corpus: CCMAS + NDEPS + 55 adverts', meta: '25 Sept 2026 · 56 documents · 20 topics', progress: 'Not started', pct: '0%', accepted: '0', courses: '0' }
      ]
    };
  }
}
</script>
</body>
</html>
