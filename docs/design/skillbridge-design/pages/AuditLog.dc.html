<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Activity log</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#FBF6EF;color:#231A14}
a{color:#A8431E}a:hover{color:#7E2F12}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #FBF6EF;">
  <div style="width: 256px; flex-shrink: 0; background: #FFFFFF; border-right: 1px solid #EADFD3;"><dc-import name="Sidebar" active="audit" admin="{{yes}}" hint-size="256px,900px"></dc-import></div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0;">
    <dc-import name="TopBar" title="Activity log" crumb="Administration" person="Owoabasi Eshiet" role="Administrator" initials="OE" hint-size="1184px,72px"></dc-import>
    <main style="padding: 26px 40px; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: flex-end;">
        <div style="display: flex; flex-direction: column; gap: 4px;"><h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.03em;">Activity log</h1><p style="margin: 0; font-size: 14px; color: #5E5249;">A record of who did what, and when.</p></div>
        <button type="button" style="height: 46px; padding: 0 18px; border-radius: 12px; border: 1px solid #E3D6C8; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; color: #231A14;">Download as spreadsheet</button>
      </div>
      <div style="display: flex; gap: 10px;">
        <select aria-label="Person" style="height: 44px; padding: 0 12px; font: inherit; font-size: 14px; border: 1px solid #E3D6C8; border-radius: 12px; background: #FFFFFF;"><option>Everyone</option></select>
        <select aria-label="Activity" style="height: 44px; padding: 0 12px; font: inherit; font-size: 14px; border: 1px solid #E3D6C8; border-radius: 12px; background: #FFFFFF;"><option>All activity</option></select>
        <select aria-label="Date range" style="height: 44px; padding: 0 12px; font: inherit; font-size: 14px; border: 1px solid #E3D6C8; border-radius: 12px; background: #FFFFFF;"><option>Last 7 days</option></select>
      </div>
      <section style="background: #FFFFFF; border: 1px solid #EADFD3; border-radius: 20px; overflow: hidden;">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
          <div style="display: flex; align-items: center; gap: 16px; padding: 13px 24px; border-bottom: 1px solid #F1E8DE;">
            <span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; display: flex; align-items: center; justify-content: center; {{r.tint}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.d}}"></path></svg></span>
            <span style="flex-grow: 1; font-size: 14px;"><strong>{{r.who}}</strong> {{r.what}}</span>
            <span style="font-size: 13px; color: #6F625A; white-space: nowrap;">{{r.when}}</span>
          </div>
        </sc-for>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = 'M5 12l5 5 9-10';
    const doc = 'M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6';
    const user = 'M12 12a4 4 0 1 0 0-8a4 4 0 1 0 0 8zM4 21a8 8 0 0 1 16 0';
    const key = 'M15 7h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3M12 3v10M8 9l4 4 4-4';
    const green = 'background: #E3F1E4; color: #2F6B3A;';
    const clay = 'background: #F8E6DC; color: #A8431E;';
    const amber = 'background: #FDF1D8; color: #8A5A00;';
    const grey = 'background: #F1E8DE; color: #6F625A;';
    return {
      yes: true,
      rows: [
        { who: 'Mr John Okon', what: 'designed the course CSC 419 Software Testing and Quality Assurance', when: 'Today, 21:40', d: doc, tint: clay },
        { who: 'Mr John Okon', what: 'accepted the topic “Software Testing and Quality Assurance”', when: 'Today, 21:32', d: ok, tint: green },
        { who: 'Mr John Okon', what: 'downloaded a report for “Real corpus (final)”', when: 'Today, 21:20', d: doc, tint: amber },
        { who: 'Mr John Okon', what: 'signed in', when: 'Today, 21:05', d: key, tint: grey },
        { who: 'Owoabasi Eshiet', what: 'added the user Mr John Okon (Curriculum Planner)', when: 'Today, 16:22', d: user, tint: clay },
        { who: 'Owoabasi Eshiet', what: 'changed which NUC courses are left out', when: 'Today, 15:10', d: doc, tint: amber },
        { who: 'Owoabasi Eshiet', what: 'started the analysis “Real corpus (final)”', when: 'Today, 14:30', d: ok, tint: green },
        { who: 'Owoabasi Eshiet', what: 'signed in', when: 'Today, 13:41', d: key, tint: grey }
      ]
    };
  }
}
</script>
</body>
</html>
